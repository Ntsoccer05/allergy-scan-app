version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: allergy_scan_db
    environment:
      POSTGRES_DB: allergy_scan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your-postgres-password}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d allergy_scan']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: allergy_scan_backend
    ports:
      - '3001:3001'
    env_file:
      - ./backend/.env
    environment:
      # docker-compose 環境では DB ホストをサービス名 db に上書き
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-your-postgres-password}@db:5432/allergy_scan?schema=public
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: allergy_scan_frontend
    ports:
      - '3000:3000'
    env_file:
      - ./frontend/.env

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: allergy_scan_garage
    ports:
      - '3900:3900'   # S3 API
      - '3901:3901'   # RPC（内部通信）
      - '3902:3902'   # Website（公開読み取り用）
      - '3903:3903'   # Admin API（garage-webui 用）
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
      - ./docker/garage/meta:/var/lib/garage/meta
      - ./docker/garage/data:/var/lib/garage/data
    restart: unless-stopped

  garage-webui:
    image: khairul169/garage-webui:latest
    container_name: allergy_scan_garage_webui
    ports:
      - '3909:3909'
    environment:
      API_BASE_URL: 'http://garage:3903'
      S3_ENDPOINT_URL: 'http://garage:3900'
      API_TOKEN: 'dev-admin-token'
    depends_on:
      - garage

volumes:
  postgres_data:
