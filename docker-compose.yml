version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: allergy_scan_db
    environment:
      POSTGRES_DB: allergy_scan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your-postgres-password}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d allergy_scan']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: allergy_scan_backend
    ports:
      - '3001:3001'
    env_file:
      - ./backend/.env
    environment:
      # docker-compose 環境では DB ホストをサービス名 db に上書き
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-your-postgres-password}@db:5432/allergy_scan?schema=public
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: allergy_scan_frontend
    ports:
      - '3000:3000'
    env_file:
      - ./frontend/.env

volumes:
  postgres_data:
