version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: allergy_scan_db
    environment:
      POSTGRES_DB: allergy_scan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d allergy_scan']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
