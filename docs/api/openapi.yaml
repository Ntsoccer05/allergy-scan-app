openapi: 3.0.3
info:
  title: Allergy Scan API
  version: 2.0.0
  description: |
    アレルギースキャンアプリのバックエンド API。
    NestJS on AWS Lambda で実装。

    > このファイルは正典（source of truth）。API 変更時は必ずこのファイルを更新すること。

    **認証方式（現行）**: Cookie ベース認証（HttpOnly Cookie `user_id`）。
    Phase 1（pending）で Supabase Auth JWT Bearer Token に統一予定。

servers:
  - url: https://api.example.com
    description: Production (AWS Lambda)
  - url: http://localhost:3001
    description: Local development

tags:
  - name: allergens
    description: アレルギーマスター
  - name: scan
    description: スキャン（バーコード・OCR）
  - name: history
    description: スキャン履歴
  - name: public
    description: 認証不要の公開エンドポイント
  - name: users
    description: ユーザー設定
  - name: admin
    description: 管理者専用（app_metadata.role === "admin"）
  - name: webhooks
    description: 外部サービス Webhook

paths:
  /users/me/init:
    post:
      tags: [users]
      summary: 初回ユーザー登録
      description: |
        Supabase JWT を検証し、users テーブルに初回 INSERT する。
        既存ユーザーの場合は 200 を返す（冪等）。
        Bearer Token 必須。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 既存ユーザー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitResponse"
              example:
                created: false
        "201":
          description: 新規ユーザー作成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitResponse"
              example:
                created: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me:
    get:
      tags: [users]
      summary: ユーザー設定取得
      description: TTL 5分でキャッシュ。スキャン開始時に呼び出し Gemini プロンプト動的生成に使用。
      security:
        - cookieAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"

    put:
      tags: [users]
      summary: アレルギー設定更新
      description: |
        enabled を true にした瞬間、partialAlert も自動で true になる。
        enabled を false にした瞬間、partialAlert も自動で false になる。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllergySettingsUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

    delete:
      tags: [users]
      summary: ユーザーデータ削除
      description: |
        要配慮個人情報（アレルギー設定・スキャン履歴）を全削除。
        個人情報保護法上、ユーザーからの削除要求に対応するため必須。
      security:
        - cookieAuth: []
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"

  /allergens:
    get:
      tags: [allergens]
      summary: アレルギーマスター取得
      description: 設定画面用。category・display_order 順で返す。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AllergenCategory"
              example:
                - category: mandatory
                  label: "特定原材料（9品目・表示義務あり）"
                  items:
                    - name: えび
                      emoji: 🦐
                      display_order: 1
                    - name: 卵
                      emoji: 🥚
                      display_order: 7
                - category: recommended
                  label: "準ずるもの（20品目・表示推奨）"
                  items:
                    - name: アーモンド
                      emoji: 🌰
                      display_order: 10

  /scan/presigned-url:
    get:
      tags: [scan]
      summary: S3 Presigned URL 発行
      description: |
        クライアントが直接 S3 に画像をアップロードするための URL を発行する。
        Lambda の 6MB ペイロード制限を回避するため、画像は Lambda 経由で受け取らない。
      security:
        - cookieAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignedUrlResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /scan/barcode:
    post:
      tags: [scan]
      summary: バーコード（JAN コード）照合
      description: |
        照合フロー:
        1. NestJS メモリキャッシュ確認（TTL: 60秒）
        2. DB の expires_at 確認（有効期限内なら即返却）
        3. Open Food Facts API 照合
        4. ミスなら `found: false` を返却（クライアントが OCR に切り替え）
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BarcodeScanRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BarcodeScanResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /scan/ocr:
    post:
      tags: [scan]
      summary: OCR + アレルギー判定
      description: |
        フロー:
        1. 日次スキャン上限チェック（user_daily_scans）
        2. S3 から画像取得
        3. ユーザーの有効アレルギーを取得
        4. allergen_components から成分リストを動的生成
        5. Gemini Flash API に送信
        6. incomplete: true → 400 返却
        7. confidence: low → 422 返却（再スキャン誘導）
        8. products テーブルに UPSERT（scan_count +1、expires_at 再計算）
        9. scan_histories に記録
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OcrScanRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OcrScanResponse"
        "400":
          description: incomplete（ラベル全体が映っていない）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: 原材料またはバーコード全体が映るように撮影してください。
                code: INCOMPLETE_IMAGE
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: confidence が low（近づけて再スキャン）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: もう少し近づけて再スキャンしてください
                code: LOW_CONFIDENCE
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /history:
    get:
      tags: [history]
      summary: スキャン履歴一覧
      description: カーソルベースページネーション。20件ずつ返す。
      security:
        - cookieAuth: []
      parameters:
        - name: filter
          in: query
          schema:
            type: string
            enum: [all, ng, partial, ok]
            default: all
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 50
        - name: cursor
          in: query
          description: 前ページの最後の scanned_at（ISO 8601）
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [history]
      summary: スキャン履歴保存
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HistorySaveRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanHistory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /history/{id}:
    patch:
      tags: [history]
      summary: スキャン履歴編集
      description: |
        product_name / store_name / memo / is_public を更新できる。
        Cookie の userId と history.user_id が一致しない場合は 403 を返す。
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchHistoryRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanHistory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden（他ユーザーの履歴への操作）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags: [history]
      summary: スキャン履歴削除
      description: |
        指定した履歴を削除する。
        Cookie の userId と history.user_id が一致しない場合は 403 を返す。
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden（他ユーザーの履歴への操作）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /public/history:
    get:
      tags: [public]
      summary: みんなのスキャン一覧
      description: |
        全ユーザーの is_public=true の履歴をカーソルページネーションで返す。
        認証不要。
      parameters:
        - name: cursor
          in: query
          description: 前ページの最後の scanned_at（ISO 8601）
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicHistoryListResponse"

  /public/history/digest:
    get:
      tags: [public]
      summary: みんなのスキャン新着件数
      description: |
        ポーリング用。指定カーソル以降の is_public=true 件数を返す。
        認証不要。
      parameters:
        - name: since
          in: query
          description: この scanned_at 以降の件数を返す（ISO 8601）
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigestResponse"

  /admin/users:
    get:
      tags: [admin]
      summary: ユーザー一覧
      description: admin 専用。カーソルページネーション。
      security:
        - cookieAuth: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/stats:
    get:
      tags: [admin]
      summary: 統計情報
      description: admin 専用。DAU・スキャン数・プラン別ユーザー数等。
      security:
        - cookieAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/users/{id}/plan:
    patch:
      tags: [admin]
      summary: ユーザーのプラン手動変更
      description: admin 専用。user_subscriptions を直接更新する。
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPatchPlanRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPatchPlanResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /webhooks/stripe:
    post:
      tags: [webhooks]
      summary: Stripe Webhook 受信
      description: |
        Stripe からのイベントを受信する。署名検証あり。
        認証不要（@Public）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK
        "400":
          description: 署名検証失敗
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    AllergenCategory:
      type: object
      required: [category, label, items]
      properties:
        category:
          type: string
          enum: [mandatory, recommended, addiction, skin]
        label:
          type: string
          example: "特定原材料（9品目・表示義務あり）"
        items:
          type: array
          items:
            $ref: "#/components/schemas/AllergenItem"

    AllergenItem:
      type: object
      required: [name, emoji, display_order]
      properties:
        name:
          type: string
          example: 乳
        emoji:
          type: string
          example: 🥛
        display_order:
          type: integer
          example: 8

    AllergenSetting:
      type: object
      required: [enabled, partialAlert]
      properties:
        enabled:
          type: boolean
        partialAlert:
          type: boolean

    PresignedUrlResponse:
      type: object
      required: [url, s3_key]
      properties:
        url:
          type: string
          format: uri
          description: S3 PUT 用 Presigned URL
        s3_key:
          type: string
          description: OCR リクエスト時に渡す S3 キー

    BarcodeScanRequest:
      type: object
      required: [jan_code]
      properties:
        jan_code:
          type: string
          pattern: '^\d{8,13}$'
          example: "4901234567890"

    BarcodeScanResponse:
      type: object
      required: [found]
      properties:
        found:
          type: boolean
        product_name:
          type: string
          nullable: true
        allergens:
          $ref: "#/components/schemas/ProductAllergens"
          nullable: true
        judgment:
          $ref: "#/components/schemas/JudgmentShort"
          nullable: true
        detected:
          type: array
          items:
            type: string
          nullable: true
        from_cache:
          type: boolean

    ProductAllergens:
      type: object
      properties:
        contains:
          type: array
          items:
            type: string
          description: 含むアレルギー
        partial:
          type: array
          items:
            type: string
          description: 一部含むアレルギー
        components:
          type: array
          items:
            type: string
          description: 検出された派生成分

    OcrScanRequest:
      type: object
      required: [s3_key]
      properties:
        s3_key:
          type: string
          description: /scan/presigned-url で取得した S3 キー

    OcrScanResponse:
      type: object
      required: [raw_text, confidence, results, highlights, incomplete]
      properties:
        raw_text:
          type: string
          description: OCR で読み取った原材料テキスト全文
        confidence:
          $ref: "#/components/schemas/Confidence"
        results:
          type: array
          items:
            $ref: "#/components/schemas/AllergenResult"
          description: アレルギーごとの判定結果（複数）
        highlights:
          type: array
          items:
            $ref: "#/components/schemas/HighlightItem"
          description: UI ハイライト用テキスト一覧（raw_text 内の検出箇所）
        incomplete:
          type: boolean
          description: ラベル全体が映っていない場合 true
        price:
          type: number
          nullable: true
          description: 税抜価格（取得できた場合のみ）
        price_with_tax:
          type: number
          nullable: true
          description: 税込価格
        price_confidence:
          type: string
          enum: [high, low]
          nullable: true
          description: 価格の読み取り信頼度（high のみ UI 表示）
        product_name:
          type: string
          nullable: true
          description: ラベルから読み取った商品名

    AllergenResult:
      type: object
      required: [allergen, judgment, detection_type, detected, risk_level, reason]
      properties:
        allergen:
          type: string
          description: アレルギー名（allergens.name と一致）
        judgment:
          $ref: "#/components/schemas/Judgment"
        detection_type:
          type: string
          enum: [contains, partial, may_contain]
          description: |
            contains: 原材料として直接含む（🔴 NG）
            partial: 一部に含む・一括表示パターン（🟡 注意）
            may_contain: 製造ラインのコンタミ注意喚起（🟠 注意喚起）
        detected:
          type: array
          items:
            type: string
          description: 検出された成分名リスト
        risk_level:
          type: string
          enum: [high, medium, low, ignore]
          description: アナフィラキシーリスクレベル
        reason:
          type: string
          description: 判定理由

    HighlightItem:
      type: object
      required: [text, judgment]
      properties:
        text:
          type: string
          description: raw_text 内のハイライト対象テキスト
        judgment:
          type: string
          enum: [ng, partial, may_contain]
          description: "ng: 🔴 / partial: 🟡 / may_contain: 🟠"

    HistoryListResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScanHistory"
        nextCursor:
          type: string
          format: date-time
          nullable: true

    ScanHistory:
      type: object
      required: [id, judgment, scanned_at]
      properties:
        id:
          type: string
          format: uuid
        product_name:
          type: string
          nullable: true
        judgment:
          $ref: "#/components/schemas/JudgmentShort"
        detected:
          type: array
          items:
            type: string
        location:
          $ref: "#/components/schemas/Location"
          nullable: true
        thumbnail_url:
          type: string
          format: uri
          nullable: true
          description: 惣菜のみ（S3 URL）
        ocr_image_url:
          type: string
          nullable: true
          description: OCR スキャン画像 S3 キー（変更不可・原本）
        is_public:
          type: boolean
          description: みんなの履歴に公開するか
          default: false
        memo:
          type: string
          nullable: true
          description: ユーザーメモ
        price:
          type: number
          nullable: true
        scanned_at:
          type: string
          format: date-time

    HistorySaveRequest:
      type: object
      required: [judgment]
      properties:
        product_id:
          type: string
          format: uuid
          nullable: true
        product_name:
          type: string
          nullable: true
        judgment:
          $ref: "#/components/schemas/JudgmentShort"
        detected:
          type: array
          items:
            type: string
        location:
          $ref: "#/components/schemas/Location"
          nullable: true
        thumbnail_url:
          type: string
          format: uri
          nullable: true
        ocr_image_url:
          type: string
          nullable: true

    PatchHistoryRequest:
      type: object
      description: 少なくとも1フィールドを含むこと
      properties:
        product_name:
          type: string
          nullable: true
        store_name:
          type: string
          nullable: true
          description: location.store_name を上書きする
        memo:
          type: string
          nullable: true
        is_public:
          type: boolean

    PublicHistoryListResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicHistoryItem"
        nextCursor:
          type: string
          format: date-time
          nullable: true

    PublicHistoryItem:
      type: object
      required: [id, judgment, scanned_at]
      properties:
        id:
          type: string
          format: uuid
        product_name:
          type: string
          nullable: true
        judgment:
          $ref: "#/components/schemas/JudgmentShort"
        detected:
          type: array
          items:
            type: string
        thumbnail_url:
          type: string
          nullable: true
        scanned_at:
          type: string
          format: date-time

    DigestResponse:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          description: since 以降の新着件数

    UserSettings:
      type: object
      required: [id, allergies, locale]
      properties:
        id:
          type: string
          description: ユーザー ID（Supabase Auth UUID）
        allergies:
          type: object
          description: キーは allergens.name と完全一致
          additionalProperties:
            $ref: "#/components/schemas/AllergenSetting"
          example:
            乳:
              enabled: true
              partialAlert: true
            卵:
              enabled: false
              partialAlert: false
        locale:
          type: string
          enum: [ja, en]
          description: ユーザーの言語設定
        plan:
          type: string
          description: 現在のプラン名（free / premium 等）
          example: free
        daily_scan_limit:
          type: integer
          description: 日次スキャン上限回数
          example: 20
        daily_scan_count:
          type: integer
          description: 今日のスキャン済み回数
          example: 5

    AllergySettingsUpdate:
      type: object
      properties:
        allergies:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AllergenSetting"
        locale:
          type: string
          enum: [ja, en]

    AdminUserListResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminUserItem"
        nextCursor:
          type: string
          format: date-time
          nullable: true

    AdminUserItem:
      type: object
      required: [id, created_at, plan]
      properties:
        id:
          type: string
          format: uuid
        locale:
          type: string
          enum: [ja, en]
        plan:
          type: string
          example: free
        created_at:
          type: string
          format: date-time
        total_scans:
          type: integer
          description: 累計スキャン数

    AdminStats:
      type: object
      properties:
        total_users:
          type: integer
        active_users_today:
          type: integer
        total_scans_today:
          type: integer
        users_by_plan:
          type: object
          additionalProperties:
            type: integer
          example:
            free: 980
            premium: 20

    AdminPatchPlanRequest:
      type: object
      required: [plan_name]
      properties:
        plan_name:
          type: string
          example: premium

    AdminPatchPlanResponse:
      type: object
      required: [user_id, plan_name]
      properties:
        user_id:
          type: string
          format: uuid
        plan_name:
          type: string

    Location:
      type: object
      properties:
        store_name:
          type: string
          nullable: true
          example: セブンイレブン渋谷店
        lat:
          type: number
          format: double
          nullable: true
        lng:
          type: number
          format: double
          nullable: true

    ErrorResponse:
      type: object
      required: [message, code]
      properties:
        message:
          type: string
        code:
          type: string

    InitResponse:
      type: object
      required: [created]
      properties:
        created:
          type: boolean
          description: true = 新規ユーザー作成、false = 既存ユーザー

    Judgment:
      type: string
      enum: [含む, 一部含む, なし, 判定不能]

    JudgmentShort:
      type: string
      enum: [ng, partial, ok]
      description: ng=含む / partial=一部含む / ok=なし

    Confidence:
      type: string
      enum: [high, medium, low]

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: user_id
      description: 現行認証方式（Cookie ベース）。Phase 1 で JWT Bearer に移行予定。
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Phase 1 以降の認証方式（Supabase Auth JWT）。

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized（認証なし）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden（権限なし）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Too Many Requests（日次スキャン上限または DDoS 制限）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            message: 本日のスキャン上限（20回）に達しました
            code: DAILY_LIMIT_EXCEEDED
